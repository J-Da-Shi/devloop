services:
  devloop:
    build:
      context: .
      args:
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.145.0}
    image: devloop:local
    container_name: devloop
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${DEVLOOP_PORT:-4317}:4317"
    environment:
      DEVLOOP_HOST: 0.0.0.0
      DEVLOOP_PORT: 4317
      DEVLOOP_ALLOW_LAN: "true"
      DEVLOOP_DATA_DIR: /data
      DEVLOOP_RUNNER: ${DEVLOOP_RUNNER:-codex}
      DEVLOOP_CODEX_IGNORE_USER_CONFIG: ${DEVLOOP_CODEX_IGNORE_USER_CONFIG:-false}
      DEVLOOP_CODEX_TIMEOUT_MS: ${DEVLOOP_CODEX_TIMEOUT_MS:-1800000}
      DEVLOOP_AGENT_CLAIM_DELAY_MS: ${DEVLOOP_AGENT_CLAIM_DELAY_MS:-5000}
      DEVLOOP_LOG_LEVEL: ${DEVLOOP_LOG_LEVEL:-info}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - ./data:/data
      - ${DEVLOOP_CODEX_DIR:-./config/codex}:/home/devloop/.codex
      - ${DEVLOOP_SSH_DIR:-./config/ssh}:/home/devloop/.ssh:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4317/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
